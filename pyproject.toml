[project]
name = "football-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "stable-baselines3>=2.9.2",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
